<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css.css">

</head>
<body>
  <div class="page">
    <div class="image">
      <img src="https://images.unsplash.com/photo-1613380833328-6751a8f7b992?q=80&w=738&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Background">
       <div class="logo">
          Kitty
       </div>

       <p class="credit">Photo by Moon Moons on Unsplash</p>
    </div>

    <div class="form-side">

        <div class="intro">
          <h2>Join the Kitty Club!</h2>
          <p>
            This is not a real online service, but you know you want to.
            Sign up now to get started.
          </p>
        </div>

       <form>
          <div class="form-box">
            <div class="form-row">
              <div class="form-group">
                <label for="first-name">FIRST NAME</label>
                <input type="text" id="first-name" name="firstName" pattern="[A-Za-z]+" required>

              </div>
          
              <div class="form-group">
               <label for="last-name">LAST NAME</label>
               <input type="text" id="last-name" name="lastName" pattern="[A-Za-z]+">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="email">EMAIL</label>
                <input type="email" id="email" name="email" required>
              </div>

              <div class="form-group">
                <label for="number">PHONE NO.</label>
                <input type="tel" id="number" name="number" pattern="[0-9]{10}">
              </div>
          
            </div>
            <div class="form-row">  
              <div class="form-group">
                <label for="pwd">PASSWORD</label>
                <input type="password" id="pwd" name="pwd" 
                   pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}" 
                   minlength="8" required>
              </div>
            
              <div class="form-group">
               <label for="confirmPwd">CONFIRM PASSWORD</label>
               <input type="password" id="confirmPwd" name="confirmPwd" 
                minlength="8" required>        
              </div>

            </div>

          </div>
          <diV class="form-action">

            <button type="submit">
               Create Account
            </button>

            <p class="login">
              Already have an account?
              <a href="#">Log in</a>
            </p>
          </diV>
        </form>

    </div>
    
  </div>
  

</body>
</html>
